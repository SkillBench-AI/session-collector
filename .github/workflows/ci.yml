name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # lint: fast static checks on every Python / shell / Makefile artefact.
  # Catches syntax regressions in minutes before we pay for slower jobs.
  # -------------------------------------------------------------------------
  lint:
    name: Lint (python + shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python AST parse check
        run: |
          set -euo pipefail
          # Fail fast if any source file has a syntax error.
          find src tests scripts -name '*.py' -print0 \
            | xargs -0 -n1 python3 -c 'import ast,sys; ast.parse(open(sys.argv[1]).read()); print("ok:", sys.argv[1])'

      - name: Shell syntax check (bash -n)
        run: |
          set -euo pipefail
          for f in install.sh collect.sh andela-collect.sh scripts/_docker_run.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Makefile parse (dry-run)
        run: |
          set -euo pipefail
          # --dry-run exits non-zero on syntax errors in the Makefile itself.
          # We also list the targets we expect to exist.
          make -n docker-build >/dev/null
          make -n preflight-host >/dev/null

  # -------------------------------------------------------------------------
  # test: pytest across the supported Python range. We support 3.9+ per
  # pyproject.toml; keeping the matrix honest prevents drift.
  # -------------------------------------------------------------------------
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  # -------------------------------------------------------------------------
  # package: verify the published artifact can be built before release.
  # -------------------------------------------------------------------------
  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

  # -------------------------------------------------------------------------
  # shell-install: exercise the curl|bash install path end-to-end on a clean
  # Ubuntu runner. CI points SKILLBENCH_PACKAGE at this checkout so the test
  # does not depend on a package already being published to PyPI.
  # -------------------------------------------------------------------------
  shell-install:
    name: Install flow (collect.sh / andela-collect.sh)
    runs-on: ubuntu-latest
    # GH_TOKEN=GITHUB_TOKEN lets `gh auth status` pass inside the scripts, so
    # the interactive `gh auth login` branch is never reached. The scripts also
    # guard against CI/non-TTY themselves — this is belt-and-suspenders.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --user pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run install.sh (local package override)
        run: SKILLBENCH_PACKAGE="$PWD" bash install.sh

      - name: Run collect.sh --help (local package override)
        run: SKILLBENCH_PACKAGE="$PWD" bash collect.sh --help

      - name: Verify skillbench is on PATH after collect.sh
        run: |
          set -euo pipefail
          command -v skillbench
          skillbench --help >/dev/null
          skillbench collect --help >/dev/null

      - name: Run andela-collect.sh --help
        # Re-uses the already-installed pipx package; confirms the Andela
        # wrapper still feeds `--allowed-orgs` correctly.
        run: SKILLBENCH_PACKAGE="$PWD" bash andela-collect.sh --help

  # -------------------------------------------------------------------------
  # docker: build the image and smoke-test the two entry points from inside
  # the container. This mirrors `make docker-collect` without the host mounts
  # (which aren't available in CI) or gh auth (which `--help` doesn't need).
  # -------------------------------------------------------------------------
  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: skillbench-session-collector:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Smoke: python3 -m skillbench --help"
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            skillbench-session-collector:ci \
            python3 -m skillbench --help

      - name: "Smoke: python3 -m skillbench collect --help"
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            skillbench-session-collector:ci \
            python3 -m skillbench collect --help

      - name: "Smoke: gh + git are installed inside the image"
        run: |
          docker run --rm skillbench-session-collector:ci \
            sh -c 'command -v gh && command -v git && gh --version | head -n1'

      - name: "Smoke: skillbench collect --yes (headless run, must exit, not hang)"
        env:
          # Let `gh auth status` inside the container pass so we don't trigger
          # interactive auth paths during collect.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Mount an empty HOME so the scanner sees no agent data (no
          # ~/.claude / ~/.gemini / ~/.codex). We don't care about the exit
          # code — collect will legitimately exit non-zero with "no sessions"
          # or "no auto-includable workspaces". What we DO care about: the
          # process terminates within the timeout. A hang here = regression
          # in the headless path (e.g. a prompt without `--yes` guard, an
          # interactive gh login reached unexpectedly, etc.).
          mkdir -p "$RUNNER_TEMP/empty-home"
          docker run --rm \
            -e HOME=/home/app \
            -e CI=true \
            -e GH_TOKEN \
            -v "$RUNNER_TEMP/empty-home:/home/app" \
            -v "$PWD:/work" -w /work \
            skillbench-session-collector:ci \
            timeout 60 python3 -m skillbench collect --yes
          EXIT=$?
          echo "collect exit code: $EXIT"
          if [ "$EXIT" = "124" ]; then
            echo "::error::skillbench collect hung (60s timeout) — headless path regression."
            exit 1
          fi
          # 0 = sessions found + collected (unlikely here), 1 = no data/no scope
          # (expected). Anything else is a real error.
          if [ "$EXIT" != "0" ] && [ "$EXIT" != "1" ]; then
            echo "::error::unexpected exit code $EXIT (expected 0 or 1 for empty HOME)."
            exit 1
          fi
