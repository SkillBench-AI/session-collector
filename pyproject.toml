[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbench"
version = "0.1.0"
description = "SkillBench session-collector: agentic engineering metrics from CASS data"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    # Arrow-key / space-toggle selection for interactive private-repo picker.
    # Pure-Python, falls back gracefully if import fails (see _select_workspaces).
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
skillbench = "skillbench:main"
