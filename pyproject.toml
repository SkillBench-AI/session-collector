[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbench"
version = "0.1.0"
description = "SkillBench session-collector: agentic engineering metrics from CASS data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "ce-engine @ git+https://github.com/SkillBench-AI/ce-engine.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
skillbench = "skillbench:main"
