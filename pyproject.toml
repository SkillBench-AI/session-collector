[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbench-session-collector"
version = "0.1.0"
description = "SkillBench session collector for local AI coding sessions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "SkillBench AI"},
]
keywords = ["ai", "coding-agent", "codex", "session-collector", "skillbench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    # Arrow-key / space-toggle selection for interactive private-repo picker.
    # Pure-Python, falls back gracefully if import fails (see _select_workspaces).
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/SkillBench-AI/session-collector"
Repository = "https://github.com/SkillBench-AI/session-collector"
Issues = "https://github.com/SkillBench-AI/session-collector/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
skillbench = "skillbench:main"
